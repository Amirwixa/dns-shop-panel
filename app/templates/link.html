<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | پنل مدیریت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Vazirmatn', sans-serif;
  background: radial-gradient(circle at 50% 0%, #4a0a18 0%, #0d0d12 60%);
  background-color: #0d0d12;
  color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.card {
  background: rgba(20, 15, 18, 0.6); backdrop-filter: blur(20px);
  border: 1px solid rgba(226, 38, 88, 0.15); border-radius: 24px;
  padding: 45px 40px; width: 100%; max-width: 420px;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  animation: floatUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.logo { text-align: center; margin-bottom: 35px; }
.logo .icon {
  font-size: 48px; background: linear-gradient(135deg, #ff2a5f, #8b0029);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(226, 38, 88, 0.3));
}
.logo h1 { font-size: 24px; margin-top: 12px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
.logo p { font-size: 13.5px; opacity: 0.6; margin-top: 4px; }
.field { margin-bottom: 20px; }
.field label { display: block; font-size: 13px; margin-bottom: 8px; font-weight: 500; color: #94a3b8; }
.field input {
  width: 100%; padding: 14px 16px; border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(0, 0, 0, 0.4);
  color: #fff; font-size: 15px; outline: none; transition: all 0.3s ease; font-family: inherit;
}
.field input:focus {
  border-color: #8b0029; background: rgba(139, 0, 41, 0.05);
  box-shadow: 0 0 0 4px rgba(226, 38, 88, 0.1);
}
.field input::placeholder { color: rgba(255, 255, 255, 0.2); }
button {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #8b0029, #c1123e);
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all 0.3s ease; font-family: inherit; margin-top: 10px;
  box-shadow: 0 8px 20px -6px rgba(193, 18, 62, 0.5);
}
button:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -6px rgba(193, 18, 62, 0.65); filter: brightness(1.1); }
button:disabled { opacity: 0.6; cursor: wait; transform: none; }
.err {
  background: rgba(255, 59, 48, 0.1); border-left: 4px solid #ff3b30;
  color: #ffcdd2; padding: 12px 16px; border-radius: 8px; font-size: 13.5px; margin-bottom: 20px; display: none;
}
.foot { text-align: center; margin-top: 25px; font-size: 12px; color: #64748b; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="icon">⬡</div><h1>ورود به سیستم</h1><p>دسترسی مدیریت شبکه</p></div>
  <div class="err" id="err"></div>
  <form id="f">
    <div class="field"><label>شناسه کاربری</label><input name="username" placeholder="admin" autocomplete="username" required></div>
    <div class="field"><label>گذرواژه</label><input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
    <button id="btn" type="submit">تایید و ورود</button>
  </form>
  <div class="foot">Secure DNS Gateway</div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'در حال احراز هویت...'; err.style.display = 'none';
  const fd = new FormData(e.target);
  try {
    const r = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})});
    const j = await r.json();
    if (j.ok) location.href = '/'; else { err.textContent = j.error || 'خطا در ورود'; err.style.display = 'block'; }
  } catch(ex) { err.textContent = 'عدم ارتباط با سرور'; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'تایید و ورود';
});
</script>
</body>
</html>
